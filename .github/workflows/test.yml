name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_daily_routine
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'astrbot==4.29.4' ruff -r astrbot_plugin_daily_routine/requirements.txt
      - run: python -m ruff check astrbot_plugin_daily_routine
      - run: python -m unittest discover -s astrbot_plugin_daily_routine/tests -v
